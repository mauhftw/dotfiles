# Colors
# light blue: #89dceb
# violet:     #cba6f7
# background: default (transparent, uses the terminal background)
# text:       #bac2de

# Global options
set -g history-limit 50000
set -g default-terminal "xterm-256color"
set -ag terminal-overrides ",*:RGB"
set-option -g default-command bash
set -g base-index 0
setw -g pane-base-index 0
set -g renumber-windows on

# Status bar
# Clear legacy status-bg/status-fg so they don't override status-style
set -gu status-bg
set -gu status-fg
set -g status on
set -g status-interval 1
set -g status-justify left
set -g status-style "bg=default,fg=#bac2de"

# Session name in a violet block on the left
set -g status-left-length 40
set -g status-left "#[bg=#cba6f7,fg=#1e1e2e] #S #[default]  "

# Ping script on the right
set -g status-right-length 60
set -g status-right "#[fg=#bac2de]#(/Users/mauh/dotfiles/bin/tmux-statusbar-ping) "

# Windows
# Format: index:name followed by window flags (like Z or *), separated by a space
set -g window-status-format         "  #I:#W#{?window_flags, #{window_flags},}  "
set -g window-status-current-format "  #I:#W#{?window_flags, #{window_flags},}  "

# Inactive windows in light grey, current window as a light blue block
set -g window-status-style          "fg=#bac2de,bg=default"
set -g window-status-current-style  "fg=#1e1e2e,bg=#89dceb,bold"
set -g window-status-separator      "    "
set -g window-status-activity-style "fg=#bac2de,bg=default"
set -g window-status-bell-style     "fg=#bac2de,bg=default"

# Panes and messages
set -g pane-border-style        "fg=#313244,bg=default"
set -g pane-active-border-style "fg=#89dceb,bg=default"
set -g message-style            "bg=default,fg=#89dceb"
set -g mode-style               "bg=#89dceb,fg=#1e1e2e"
